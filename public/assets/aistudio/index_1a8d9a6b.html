if(page==="archive"||page==="library"){document.getElementById("app").innerHTML=`<h2>Loading…</h2><div class="list"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>`;setTimeout(render,250)}else render()}
function render(){const p=state.page,a=document.getElementById("app");if(!PROG){a.innerHTML=choose();return}a.innerHTML=({home,archive,question,library,resource,upload,teacher,signup,mcq,about}[p]||home)();bind()}

function tagText(q){return [...splitTags(q.exam).map(e=>(q.board?q.board+" ":"")+e),...splitTags(q.other).map(x=>x+" (board not stated)")]}
function qCard(q){const tg=tagText(q);return `<button class="item qa" onclick="go('question','${q.id}')"><span class="badge demo">${q.real?(q.verified?"Verified":"Unverified"):"Demo"}</span><span class="badge">${esc(q.subject)}</span>${q.section?`<span class="badge">${esc(q.section)}</span>`:""}${tg.length?`<span class="badge ok">${esc(tg.join(", "))}</span>`:'<span class="badge">No exam tag</span>'}<h3 style="margin:8px 0 2px">${esc(q.text)}</h3><span class="mut">${esc(q.topic)}${q.real?" \u00b7 "+esc(q.page):""}</span></button>`}
function who(r){return r.demo?"Demo entry":"Shared by "+esc(r.uploader)+(r.college?" \u00b7 "+esc(r.college):"")}
function rCard(r){return `<button class="item" onclick="go('resource','${r.id}')">${r.demo?'<span class="badge demo">Demo</span>':r.srv?'<span class="badge ok">Student note</span>':'<span class="badge ok">Your upload</span>'}<span class="badge">${esc(r.kind)}</span><span class="badge">${esc(r.subject)}</span><h3 style="margin:8px 0 2px">${esc(r.title)}</h3><span class="mut">${esc(r.topic)} \u00b7 ${esc(r.date)}</span><div class="who">${who(r)}</div></button>`}
function grouped(res){if(!res.length)return '<div class="empty">No resources found. Be the first to add one.</div>';
const g={};res.forEach(r=>{const k=String(r.topic||"Other").trim().toLowerCase();(g[k]=g[k]||{name:String(r.topic||"Other").trim(),items:[]}).items.push(r)});
return Object.values(g).sort((a,b)=>b.items.length-a.items.length||a.name.localeCompare(b.name)).map(x=>`<section style="margin:24px 0"><h2>${esc(x.name)} <span class="badge ok">${x.items.length} note${x.items.length===1?"":"s"}</span></h2><div class="list">${x.items.map(rCard).join("")}</div></section>`).join("")}
function topicOptions(){const t=new Set();DEMO_Q.forEach(q=>t.add(q.topic.split(";")[0].trim()));SERVER_R.forEach(r=>r.topic&&t.add(String(r.topic).trim()));return [...t].sort().map(x=>`<option value="${esc(x)}">`).join("")}

function opts(arr,sel,all){return `<option value="">${all}</option>`+arr.map(v=>`<option ${String(v)===String(sel)?"selected":""}>${v}</option>`).join("")}
function archive(){
const f=state.f||{};
const topics=[...new Set(DEMO_Q.map(q=>q.topic))].sort(),years=[...new Set(DEMO_Q.map(q=>q.year))].filter(Boolean).sort().reverse(),teachers=[...new Set(DEMO_Q.filter(q=>q.verified&&q.teacher).map(q=>q.teacher))];
const res=DEMO_Q.filter(q=>(!f.subject||q.subject===f.subject)&&(!f.section||q.section===f.section)&&(!f.topic||q.topic===f.topic)&&(!f.year||String(q.year)===String(f.year))&&(!f.type||q.type===f.type)&&(!f.teacher||(q.verified&&q.teacher===f.teacher))&&hit(state.q,[q.text,q.topic,q.subject,q.answer,q.verified?q.teacher:""]));
return `<h2>Written Questions (CQ)</h2><p class="mut">${PROG==="MBBS"?"Scanned from the Orbit Question Bank (unverified). Exam tags appear only where the book prints them.":"Fictional demo records."}</p>
${secChips()}
<input id="sq" aria-label="Search questions" placeholder="Search by question text or topic…" value="${esc(state.q)}">
<div class="filters">
<select data-f="subject" aria-label="Subject">${opts(SUBJECTS,f.subject,"All subjects")}</select>

${freq2(res)}<p class="mut">${res.length} result${res.length===1?"":"s"} <button class="back" onclick="go('archive',null,{q:'',f:{}})">Clear filters</button></p>
<div class="list">${res.length?res.map(qCard).join(""):'<div class="empty">No questions match. Try fewer words or clear the filters.</div>'}</div>`}

function freq(res){const t=state.q.trim();if(!t||!res.length)return"";const c={CMU:0,CU:0};res.forEach(q=>c[q.board]++);const yc={},tc={};res.forEach(q=>{yc[q.year]=(yc[q.year]||0)+1;tc[q.type]=(tc[q.type]||0)+1});const ys=Object.keys(yc).sort().reverse().map(y=>y+": "+yc[y]).join(", "),tys=Object.keys(tc).map(k=>k+": "+tc[k]).join(", ");return `<div class="ok-box"><b>“${esc(t)}”</b> matches ${res.length} question${res.length===1?"":"s"}: <b>CMU ${c.CMU}</b> and <b>CU ${c.CU}</b>.<br>By year: ${ys}<br>By exam type: ${tys}<br><span class="mut">Fictional demo counts.</span></div>`}

let TOKEN=null,ROLE=null,COLLEGE="",VIVA=[],SERVER_R=[];

function loginPage(msg){return `<h2>Library login</h2><p class="mut">The library is for verified CMC students. Enter your email and the access code we sent you. No code yet? <a href="#signup" onclick="go('signup');return false">Request access</a></p><form id="lf" novalidate><label for="lr">Email</label><input id="lr" type="email" autocomplete="email"><label for="lc">Access code</label><input id="lc" autocapitalize="characters" autocomplete="off"><p class="field-err" id="lfe" role="alert">${msg?esc(msg):""}</p><button class="btn">Log in</button></form>`}
async function doLogin(e){e.preventDefault();const fe=document.getElementById("lfe"),email=document.getElementById("lr").value.trim().toLowerCase(),code=document.getElementById("lc").value.trim().toUpperCase();
if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)||!code){fe.textContent="Enter your email and access code.";return}
const b=e.target.querySelector("button");b.disabled=true;fe.textContent="Checking\u2026";
try{const j=await api({action:"login",email:email,code:code});if(!j.ok){fe.textContent=j.msg||"Wrong email or code.";b.disabled=false;return}
TOKEN=j.token;ROLE=j.role||"other";COLLEGE=j.college||"";try{sessionStorage.setItem("cmc_tok",TOKEN);sessionStorage.setItem("cmc_role",ROLE);sessionStorage.setItem("cmc_col",COLLEGE)}catch(x){}
await loadLibrary();renderNav();render()}catch(x){fe.textContent="Could not reach the server. Try again.";b.disabled=false}}
async function loadLibrary(){try{const j=await api({action:"library",token:TOKEN});if(!j.ok){logout();return false}
ROLE=j.role||ROLE;COLLEGE=j.college||COLLEGE;try{sessionStorage.setItem("cmc_role",ROLE||"");sessionStorage.setItem("cmc_col",COLLEGE||"")}catch(x){}
SERVER_R=(j.items||[]).map((x,i)=>({id:"v"+i,title:x.title,subject:x.subject,topic:x.topic,kind:x.kind||"Notes",desc:x.desc,uploader:x.uploader,college:x.college==="CMC"?"Chittagong Medical College":(x.college||""),date:x.date,perm:"Shared by a verified student",url:/^https:\/\//.test(x.url||"")?x.url:"",prog:x.prog==="BDS"?"BDS":"MBBS",srv:true}));return true}catch(x){return false}}
function logout(){TOKEN=null;ROLE=null;COLLEGE="";VIVA=[];SERVER_R=[];try{sessionStorage.removeItem("cmc_tok");sessionStorage.removeItem("cmc_role");sessionStorage.removeItem("cmc_col")}catch(x){}renderNav();if(PROG)render()}
function bootLib(){if(SIGNUP_URL&&TOKEN)loadLibrary().then(()=>{renderNav();render()})}
function submitPage(){return `<h2>Share a note</h2><p class="mut">Put your file in your own Google Drive, set sharing to "Anyone with the link can view", then paste the link here. An admin checks it before it appears.</p><form id="nf" novalidate><label for="nt">Title</label><input id="nt" maxlength="120"><label for="nc">Type</label><select id="nc">${opts(["Notes","Lecture","Teacher's note","Questions"],"","Choose type")}</select>
<label for="ns">Subject</label><select id="ns">${opts(SUBJECTS,"","Choose subject")}</select><label for="np">Topic</label><input id="np" maxlength="80" list="tl"><datalist id="tl">${topicOptions()}</datalist><label for="nd">Description</label><textarea id="nd" rows="3" maxlength="400"></textarea><label for="nl">Google Drive link</label><input id="nl" type="url" placeholder="https://drive.google.com/\u2026"><label style="font-weight:400;display:flex;gap:8px;margin-top:14px"><input id="nk" type="checkbox" style="width:auto;margin-top:5px"><span>I own this material or have permission to share it.</span></label><p class="field-err" id="nfe" role="alert"></p><button class="btn">Send for review</button></form><div id="ndone"></div>`}
async function doSubmit(e){e.preventDefault();const g=id=>document.getElementById(id).value.trim(),fe=document.getElementById("nfe");let err="";
if(!g("nt"))err="Enter a title.";else if(!g("nc"))err="Choose a type.";else if(!g("ns"))err="Choose a subject.";else if(!g("np"))err="Enter a topic.";else if(!g("nd"))err="Add a short description.";else if(!/^https:\/\/(drive|docs)\.google\.com\//.test(g("nl")))err="Paste a Google Drive or Docs link starting with https://";else if(!document.getElementById("nk").checked)err="Tick the permission box.";
fe.textContent=err;if(err)return;const b=e.target.querySelector("button");b.disabled=true;fe.textContent="Sending\u2026";
try{const j=await api({action:"submit",token:TOKEN,title:g("nt"),kind:g("nc"),subject:g("ns"),topic:g("np"),desc:g("nd"),link:g("nl"),prog:PROG});
if(!j.ok){if(j.expired){logout();return}fe.textContent=j.msg||"Could not send.";b.disabled=false;return}
fe.textContent="";document.getElementById("nf").hidden=true;document.getElementById("ndone").innerHTML=`<div class="ok-box"><b>Sent for review.</b><p>It will appear in the library after an admin approves it.</p><button class="btn" onclick="go('library')">Back to library</button></div>`}
catch(x){fe.textContent="Could not reach the server. Try again.";b.disabled=false}}
function signupForm(c){return `<p class="mut">Admins use your ID card photo only to check that you are a student of the college you choose. Your choice is a request: the admin sets your final college after seeing the card.</p>
<form id="sf" novalidate>
<label for="sk">College</label><select id="sk" onchange="document.getElementById('sox').hidden=this.value!=='Other'"><option value="CMC">Chittagong Medical College (CMC)</option><option value="Other">Another college under CMU</option></select>

${SIGNUP_URL?"":'<div class="notice" style="border:1px solid var(--warnl);border-radius:10px;padding:10px 14px;margin-bottom:12px">Preview only: the site is not connected yet, so nothing you enter is sent anywhere.</div>'}

async function submitSignup(e){e.preventDefault();const g=id=>(document.getElementById(id)||{value:""}).value.trim(),has=id=>!!document.getElementById(id),fe=document.getElementById("sfe");let err="";
const file=document.getElementById("sid").files[0];
if(!g("sn"))err="Enter your full name.";else if(!g("sb"))err="Enter your batch or session.";else if(has("sr")&&!/^\d{1,8}$/.test(g("sr")))err="Roll number should be digits only.";else if(has("ss")&&!g("ss"))err="Choose your section.";else if(g("sk")==="Other"&&g("so").length<3)err="Enter your college name.";else if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(g("se")))err="Enter a valid email address.";else if(!file)err="Attach a photo of your college ID card.";else if(!/^(image\/(jpeg|png|webp)|application\/pdf)$/.test(file.type))err="ID card must be a JPG, PNG, WebP or PDF.";else if(file.size>8*1024*1024)err="File is too large. Maximum is 8 MB.";else if(!document.getElementById("sc").checked)err="Please tick the consent box.";
fe.textContent=err;if(err)return;
const btn=e.target.querySelector("button");btn.disabled=true;fe.textContent="Preparing\u2026";
try{let blob=file;if(file.type.startsWith("image/"))blob=await compressImage(file);
if(blob.size>3*1024*1024)throw new Error("big");
const data=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=no;r.readAsDataURL(blob)});
if(SIGNUP_URL){await fetch(SIGNUP_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({name:g("sn"),batch:g("sb"),roll:g("sr"),section:g("ss"),collegeType:g("sk"),collegeName:g("so"),email:g("se"),mime:blob.type,file:data})})}
fe.textContent="";document.getElementById("sf").hidden=true;
document.getElementById("sdone").innerHTML=`<div class="ok-box"><b>${SIGNUP_URL?"Request sent.":"Form looks good (preview only)."}</b><p>${SIGNUP_URL?"An admin will check your details. This page cannot confirm delivery, so if you hear nothing in a few days, ask an admin.":"Nothing was sent because the site is not connected yet."}</p><button class="btn" onclick="go('home')">Back to home</button></div>`}
catch(x){fe.textContent="Could not prepare the file. Try a smaller photo or PDF.";btn.disabled=false}}

function freq2(all){const t=state.q.trim();if(!t||!all.length)return"";
const tp=all.filter(q=>hit(t,[q.topic])),res=tp.length?tp:all;
const ex=new Set(),ot=new Set();let tg=0;
res.forEach(q=>{const a=splitTags(q.exam),b=splitTags(q.other);a.forEach(e=>ex.add((q.board||"Board not stated")+" "+e));b.forEach(e=>ot.add(e));if(a.length||b.length)tg++});
const L=[...ex].sort();
return `<div class="ok-box"><b>${esc(t)}</b>: ${res.length} question${res.length===1?"":"s"} with this topic, ${tg} with exam tags${all.length>res.length?` (${all.length-res.length} more questions only mention the word in their text)`:""}.<br>Tagged exams (${L.length}): ${L.length?esc(L.join(", ")):"none"}${ot.size?`<br>Other tags, board not stated (${ot.size}): ${esc([...ot].join(", "))}`:""}<br><span class="mut">Counts tagged exams, not how often the book repeats a question. Untagged questions are not counted.</span></div>`}
function popular(){const c={};DEMO_Q.forEach(q=>{const k=q.topic.split(";")[0].trim();c[k]=(c[k]||0)+1});return Object.keys(c).sort((a,b)=>c[b]-c[a]).slice(0,10)}
function question(){
const q=DEMO_Q.find(x=>x.id===state.id);if(!q)return `<div class="err">Question not found.</div><button class="back" onclick="go('archive')">Back to archive</button>`;
const tg=tagText(q),rel=DEMO_Q.filter(x=>x.id!==q.id&&x.topic.split(";")[0].trim()===q.topic.split(";")[0].trim());
return `<button class="back" onclick="go('archive')">\u2190 Back to archive</button>
<span class="badge demo">${q.real?"Scanned from Orbit \u00b7 unverified":"Fictional demo record"}</span><span class="badge">${esc(q.subject)}</span>
<h1 style="font-size:1.4rem;margin-top:10px">${esc(q.text)}</h1>
<div class="card"><p><b>Topic:</b> ${esc(q.topic)}<br>${q.section?`<b>Section:</b> ${esc(q.section)}<br>`:""}<b>Exam tags:</b> ${tg.length?esc(tg.join(", ")):"None printed"}<br><b>Source:</b> ${esc(q.source)}<br><b>Verification:</b> ${q.verified?"Verified":"Unverified"}</p>
<h3>Answer (as printed)</h3><p>${esc(q.answer)}</p></div>
<section><h2>Related questions on this topic</h2><div class="list">${rel.length?rel.map(qCard).join(""):'<div class="empty">No related questions in the data.</div>'}</div></section>`}

function library(){

const f=state.f||{};const kinds=["Notes","Lecture","Teacher's note","Questions","Image","PDF","Document","Video link"];
const res=allR().filter(r=>(!f.subject||r.subject===f.subject)&&(!f.kind||r.kind===f.kind)&&hit(state.q,[r.title,r.topic,r.subject,r.desc,r.uploader]));

function resource(){
const r=allR().find(x=>x.id===state.id);if(!r)return `<div class="err">Resource not found.</div><button class="back" onclick="go('library')">Back</button>`;
const url=sessionFiles[r.id];let prev="";const more=allR().filter(x=>x.id!==r.id&&String(x.topic).trim().toLowerCase()===String(r.topic).trim().toLowerCase());
if(url&&r.mime&&r.mime.startsWith("image/"))prev=`<img class="prev" src="${url}" alt="${esc(r.title)}">`;
else if(url&&r.mime==="application/pdf")prev=`<iframe class="prev" src="${url}" style="width:100%;height:480px" title="PDF preview"></iframe>`;
else if(r.url)prev=`<p><a class="btn" style="display:inline-block;text-decoration:none" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">Open ${r.kind==="Video link"?"video":"note"}</a></p>`;
else if(!r.demo)prev=`<div class="empty">Preview unavailable. The file itself was not saved; only its details were. Re-select the file on the Upload page to preview it again.</div>`;
else prev=`<div class="empty">Demo entry with no file attached.</div>`;
return `<button class="back" onclick="go('library')">← Back to library</button>
${r.demo?'<span class="badge demo">Fictional demo record</span>':r.srv?'<span class="badge ok">Student note</span>':'<span class="badge ok">Saved in this browser only</span>'}<span class="badge">${esc(r.kind)}</span>
<h1 style="font-size:1.7rem;margin-top:10px">${esc(r.title)}</h1>
<div class="card"><p><b>Subject:</b> ${esc(r.subject)}<br><b>Topic:</b> ${esc(r.topic)}<br><b>Shared by:</b> ${esc(r.uploader)}${r.college?" \u00b7 "+esc(r.college):""}<br><b>Date:</b> ${esc(r.date)}<br><b>Source/permission:</b> ${esc(r.perm)}${r.fname?`<br><b>File:</b> ${esc(r.fname)} (${esc(r.size)})${r.note?" · "+esc(r.note):""}`:""}</p><p>${esc(r.desc)}</p></div>
<section><h2>Preview</h2>${prev}</section>

const CDN="https://cdnjs.cloudflare.com/ajax/libs/";
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>no(new Error("load"));document.head.appendChild(s)})}
async function compressImage(file){const bmp=await createImageBitmap(file);const sc=Math.min(1,1600/Math.max(bmp.width,bmp.height));const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,"image/jpeg",0.7))}
async function compressPdf(file){
if(!window.pdfjsLib)await loadScript(CDN+"pdf.js/3.11.174/pdf.min.js");
if(!window.PDFLib)await loadScript(CDN+"pdf-lib/1.17.1/pdf-lib.min.js");
pdfjsLib.GlobalWorkerOptions.workerSrc=CDN+"pdf.js/3.11.174/pdf.worker.min.js";
const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
if(pdf.numPages>80)throw new Error("too long");
const out=await PDFLib.PDFDocument.create();
for(let i=1;i<=pdf.numPages;i++){document.getElementById("fe").textContent=`Compressing page ${i} of ${pdf.numPages}…`;
const p=await pdf.getPage(i),v=p.getViewport({scale:1.5}),base=p.getViewport({scale:1});
const c=document.createElement("canvas");c.width=v.width;c.height=v.height;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);
await p.render({canvasContext:x,viewport:v}).promise;
const jb=await new Promise(r=>c.toBlob(r,"image/jpeg",0.6));const img=await out.embedJpg(await jb.arrayBuffer());
out.addPage([base.width,base.height]).drawImage(img,{x:0,y:0,width:base.width,height:base.height})}
return new Blob([await out.save()],{type:"application/pdf"})}
async function compressFile(f){if(f.type==="application/pdf")return compressPdf(f);if(f.type.startsWith("image/"))return compressImage(f);return null}

function loadMcq(){if(!MCQ_CSV_URL)return;fetch(MCQ_CSV_URL).then(r=>{if(!r.ok)throw new Error("bad");return r.text()}).then(t=>{const rows=parseCSV(t).slice(1).filter(r=>r.length>=16&&r[4]&&r[15]!=="Rejected"),out=[];
rows.forEach((r,i)=>{const type=r[1]==="TF"?"TF":"SBA",o=[r[5],r[6],r[7],r[8],r[9]],b={id:"c"+i,prog:r[0]==="BDS"?"BDS":"MBBS",type:type,subject:r[2],topic:r[3],stem:r[4],exp:r[11],board:r[12],exam:r[13],verified:r[15]==="Verified"};
if(type==="TF"){const a=String(r[10]).toUpperCase().replace(/[^TF]/g,"");if(a.length!==5)return;out.push({...b,items:o.map((x,k)=>({t:x,a:a[k]==="T"}))})}else{const k="ABCDE".indexOf(String(r[10]).trim().toUpperCase());if(k<0)return;out.push({...b,opts:o,ans:k})}});
if(out.length){MCQ_ALL=out;MCQ.ans={};if(state.page==="mcq")render()}}).catch(()=>{})}
const NOTES_FORM_PREFILL=""; // paste the Google Form pre-filled link here
const NOTES_CSV_URL=""; // paste the published CSV link of the form's response sheet here
let SHEET_R=[];
function noteForm(){if(!NOTES_FORM_PREFILL)return null;try{const u=new URL(NOTES_FORM_PREFILL),map={};u.searchParams.forEach((v,k)=>{if(k.indexOf("entry.")===0)map[String(v).toUpperCase()]=k});return{action:u.origin+u.pathname.replace(/\/viewform$/,"/formResponse"),map:map}}catch(e){return null}}
function loadNotes(){if(!NOTES_CSV_URL)return;fetch(NOTES_CSV_URL).then(r=>{if(!r.ok)throw new Error("bad");return r.text()}).then(t=>{const rows=parseCSV(t);if(rows.length<2)return;const h=rows[0].map(x=>String(x).toLowerCase()),ix=k=>h.findIndex(x=>x.indexOf(k)>=0),c={ts:ix("timestamp"),name:ix("name"),col:ix("college"),sub:ix("subject"),top:ix("topic"),ti:ix("title"),de:ix("desc"),li:ix("link"),st:ix("status"),pr:ix("program")},g=(r,k)=>k>=0?String(r[k]||"").trim():"";
SHEET_R=rows.slice(1).filter(r=>g(r,c.st).toLowerCase()==="approved"&&/^https:\/\//.test(g(r,c.li))).map((r,i)=>({id:"n"+i,title:g(r,c.ti),subject:g(r,c.sub),topic:g(r,c.top)||"Other",kind:"Notes",desc:g(r,c.de),uploader:g(r,c.name),college:g(r,c.col),date:g(r,c.ts).split(" ")[0],perm:"Shared by a student",url:g(r,c.li),prog:g(r,c.pr).toUpperCase()==="BDS"?"BDS":"MBBS",srv:true}));
if(state.page==="library"||state.page==="home")render()}).catch(()=>{})}
function vivaSoon(){return `<h2>Viva</h2><div class="card"><span class="badge demo">Under development</span><p>Teacher-wise viva questions are coming soon. You will be able to search a teacher's name and see the questions, split by subject and the date they were asked.</p></div>`}
function sections(){const m={};DEMO_Q.forEach(q=>{if(q.section)m[q.section]=(m[q.section]||0)+1});return Object.keys(m).map(k=>({name:k,n:m[k]}))}
function setSec(v){state.f={...state.f,section:v};render()}
function secChips(){const l=sections();if(!l.length)return"";const cur=(state.f||{}).section||"";return `<div class="chips" style="margin:8px 0 4px"><button class="chip ${cur?"":"on"}" data-s="" onclick="setSec(this.dataset.s)">All segments</button>${l.map(x=>`<button class="chip ${cur===x.name?"on":""}" data-s="${esc(x.name)}" onclick="setSec(this.dataset.s)">${esc(x.name)} (${x.n})</button>`).join("")}</div>`}
function hashOf(s){return "#"+s.page+(s.id?"-"+s.id:"")}
function snap(){return JSON.parse(JSON.stringify(state))}
function saveHist(){try{history.replaceState({s:snap(),y:window.scrollY},"")}catch(e){}}
function pushHist(){try{history.pushState({s:snap(),y:0},"",hashOf(state))}catch(e){}}
function fromHash(){const m=/^#([a-z]+)(?:-([a-z0-9]+))?$/.exec(location.hash||"");const ok=["home","archive","question","library","resource","upload","teacher","signup","mcq","about"];return m&&ok.includes(m[1])?{page:m[1],id:m[2]||null,q:"",f:{}}:null}
addEventListener("popstate",e=>{let st=e.state&&e.state.s;if(!st)st=fromHash()||{page:"home",id:null,q:"",f:{}};state=st;document.getElementById("nav").classList.remove("open");renderNav();render();const y=(e.state&&e.state.y)||0;requestAnimationFrame(()=>window.scrollTo(0,y))});
const h0=fromHash();if(h0&&PROG)state={...state,...h0};
try{history.replaceState({s:snap(),y:0},"",hashOf(state))}catch(e){}
renderNav();render();loadSheet();loadMcq();loadNotes();bootLib();
setTimeout(()=>{const sp=document.getElementById("splash");if(sp){sp.classList.add("hide");setTimeout(()=>sp.remove(),400)}},900);
</script>
