<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="48" height="48">
  <defs>
    <linearGradient id="cmcGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e4b3c" />
      <stop offset="100%" stop-color="#126b56" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#042018" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Shield / Folio Archive Container -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#cmcGrad)" stroke="#1a8a70" stroke-width="1.2" />

  <!-- Academic Arch / Folio Horizon Arc -->
  <path d="M10 35C15 32 20 31 24 31C28 31 33 32 38 35" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  
  <!-- Archival Pages / Open Book Base -->
  <path d="M12 33C17 30.5 21.5 30.5 24 32C26.5 30.5 31 30.5 36 33V35C31 32.5 26.5 32.5 24 34C21.5 32.5 17 32.5 12 35V33Z" fill="#ffffff" fill-opacity="0.2" />

  <!-- Central Medical Cross (Beveled, Crisp, High-Contrast) -->
  <g filter="url(#subtleShadow)">
    <!-- Vertical Cross Stem -->
    <rect x="21" y="10" width="6" height="18" rx="2" fill="#ffffff" />
    <!-- Horizontal Cross Bar -->
    <rect x="15" y="16" width="18" height="6" rx="2" fill="#ffffff" />
    <!-- Center Radiant Core / Medical Pulse Dot -->
    <circle cx="24" cy="19" r="1.5" fill="#0e4b3c" />
  </g>

  <!-- Digital Archive Node Accent -->
  <circle cx="24" cy="9" r="1.5" fill="#5eead4" />
</svg>
